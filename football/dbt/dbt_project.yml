name: football
version: "1.0.0"
config-version: 2
profile: football

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# One project for both football sports: NFL models are prefixed nfl_, college models (F2) cfb_.
# Build one sport with `--select stg_nfl_plays+` or `--select stg_cfb_plays+` (nfl/build.sh, cfb/build.sh).
# The season vars have no defaults on purpose; both builds pass all four from sparvi.toml.
vars:
  # Garbage time (NFL): a 4th-quarter play with the offense's win probability below/above these.
  # Must equal football/common/filters.py (tested).
  nfl_garbage_qtr: 4
  nfl_garbage_wp_lo: 0.10
  nfl_garbage_wp_hi: 0.90
  # Early-down pass rate counts 1st and 2nd downs in this win-probability band (neutral situations).
  nfl_neutral_wp_lo: 0.20
  nfl_neutral_wp_hi: 0.80
  # Explosive plays: passes of this many yards or more, runs of this many or more.
  explosive_pass_yds: 20
  explosive_run_yds: 12
  # The trailing window on the week slider.
  nfl_trailing_weeks: 4
  # College football (F2). `cfb_season` and `cfb_first_season` come from sparvi.toml (cfb/build.sh).
  # Garbage time: a play when the score margin exceeds these in the 2nd/3rd/4th quarter.
  # Must equal football/common/filters.py (tested).
  cfb_garbage_q2: 38
  cfb_garbage_q3: 28
  cfb_garbage_q4: 22
  cfb_trailing_weeks: 4

models:
  football:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

flags:
  send_anonymous_usage_stats: false
