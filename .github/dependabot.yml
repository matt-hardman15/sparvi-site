# Upgrades arrive as grouped weekly PRs; the `check` workflow tests each one before merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates share one PR. Majors (pandas 4, numpy 3, ...) are left out of
      # the group, so each gets its own PR and can be reviewed on its own.
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    # CLAUDE.md pins duckdb to 1.5.x (duckdb>=1.5,<1.6); dbt-duckdb and the .duckdb file format
    # move with it. Patch releases still come through. Lift this deliberately, not via Dependabot.
    ignore:
      - dependency-name: duckdb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
