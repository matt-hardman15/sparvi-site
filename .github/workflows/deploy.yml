name: deploy

# Renders the site from the data committed in site/data and deploys it to GitHub Pages.
# Runs on every push to main and by hand. The refresh and backtest workflows push their commits with
# the deploy key (not GITHUB_TOKEN), so those pushes run this too; they don't call it themselves.
# A backtest commit that only updates run metadata is pushed with [skip ci] (see backtest.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QUARTO_VERSION: "1.11.9"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Always the tip of main: when a refresh calls this, it includes the data commit just pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0   # full history: the sitemap's lastmod comes from each page's last commit

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Render
        run: |
          # Generated from the model registry at render time, never committed (a committed copy conflicted with every
          # open PR that registered a version whenever the backtest bot rewrote it).
          uv run python -m sparvi.registry export
          # uv run: post-render steps use the project's Python (site/build/social.py needs Pillow).
          cd site && uv run quarto render
          # A missing prose number renders as "?meta:..." instead of failing; fail here instead.
          if grep -rl "?meta:" ../docs --include=*.html; then echo "::error::unresolved prose numbers"; exit 1; fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
