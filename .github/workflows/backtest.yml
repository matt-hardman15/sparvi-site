name: backtest

# Backtests run on their own (PLAN-backtest §5): nobody has to remember to run one.
#   pull request touching models or the harness -> fast backtest (latest fold) of the models the change touches
#     (a file in a card's `code` list or model folder; harness files run every model: backtest/ci.py --select); a comment with the metrics vs. the last recorded run; the job
#     fails on any leakage test, a regression beyond tolerance, or a failed gate on a model that
#     isn't flagged experimental (make this check required in the "Protect main" ruleset to block merges)
#   push to main touching the same paths -> full backtests of the models the push touches; every Monday and by hand
#     -> every model; reports and the run log
#     are committed (every run is logged, passing or not)
# Raw Statcast comes from refresh-baseball's caches; batter heights from this workflow's own cache
# (never committed, never published).

on:
  # Every PR runs this workflow, because `backtest` is a required check: a PR that doesn't touch the
  # paths below passes at the "Changed paths" step without backtesting (a path filter here would leave
  # the required check waiting forever).
  pull_request:
  push:
    branches: [main]
    # The full run commits its own reports and run log; those paths are excluded (the `!` patterns
    # come last and win) so that commit can't trigger another run.
    paths: [models/**, backtest/**, baseball/**, ingest/**, football/**, nfl/**, cfb/**, sparvi/**, sparvi.toml,
            pyproject.toml, uv.lock, .github/workflows/backtest.yml,
            "!backtest/runs/**", "!models/*/*/backtest/**"]
  schedule:
    - cron: "30 10 * * 1"     # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180   # bagged pitch-quality models (v2.0.0) train ~10x longer
    steps:
      - name: Changed paths (pull request)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The files API pages up to 3,000 files; `gh pr diff` gives up past 300 (a data rebuild touches ~1,700).
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq ".[].filename")
          echo "$files" > "$RUNNER_TEMP/changed.txt"
          if echo "$files" | grep -qE '^(models/|backtest/|baseball/|ingest/|football/|nfl/|cfb/|sparvi/|sparvi\.toml$|pyproject\.toml$|uv\.lock$|\.github/workflows/backtest\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No model or harness files changed: nothing to backtest." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.SPARVI_DEPLOY_KEY || '' }}
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}    # a push compares with the commit before it

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true

      - if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen

      # Which models this change touches, and so which sports' data to restore. A pull request uses its file list, a
      # push the range it pushed (or every model when that range isn't available); Mondays and manual runs: every model.
      - name: Select models
        if: steps.gate.outputs.run == 'true'
        id: sel
        run: |
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$RUNNER_TEMP/changed.txt"
          elif [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"
            changed="$RUNNER_TEMP/changed.txt"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          uv run python -m backtest.ci ${changed:+--changed "$changed"} --select | tee -a "$GITHUB_OUTPUT"
          sel=$(uv run python -m backtest.ci ${changed:+--changed "$changed"} --select | grep '^models=' | cut -d= -f2)
          if [ -n "$sel" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "No model's files changed: nothing to backtest." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Raw-data cache keys (same as refresh-baseball)
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'baseball') }}
        id: cfg
        run: |
          season=$(uv run python -m sparvi.config baseball.season)
          past=$(uv run python -m sparvi.config baseball.past_seasons)
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "key=baseball-raw-past-${past// /-}-v1" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            for y in $past; do echo "data/raw/*_${y}.parquet"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore past-season raw data
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'baseball') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.cfg.outputs.paths }}
          key: ${{ steps.cfg.outputs.key }}
          fail-on-cache-miss: true

      # Same path list as refresh-baseball's (a cache entry only matches its exact paths).
      - name: Restore current-season raw data
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'baseball') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw/*_${{ steps.cfg.outputs.season }}.parquet
          key: baseball-raw-cur-${{ steps.cfg.outputs.season }}-none
          restore-keys: baseball-raw-cur-${{ steps.cfg.outputs.season }}-
          fail-on-cache-miss: true

      # College football (PLAYER-ADJ): the cfb workflow's raw-data cache, including CFBD's cached responses, from which
      # the play-player links are parsed (no API calls). A miss leaves the CFB backtest without data, and it fails.
      - name: Restore CFB raw data
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'cfb') }}
        id: cfb_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw/cfb
          key: cfb-raw-none
          restore-keys: cfb-raw-

      # No CFB cache yet (the cfb workflow hasn't saved one, or it was evicted): the private R2 seed instead.
      - name: Restore CFB raw data from the R2 seed
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'cfb') && steps.cfb_cache.outputs.cache-matched-key == '' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m ingest.cfb.seed restore

      - name: Parse missing play-player links (from the CFB cache)
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'cfb') }}
        run: if [ -d data/raw/cfb/cache ]; then uv run python -m ingest.cfb.play_players --missing; fi

      # Batter heights (Location+'s zone) aren't in refresh-baseball's caches: this workflow keeps its own.
      - name: Restore batter heights
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'baseball') }}
        id: heights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw/batter_heights.parquet
          key: baseball-heights-${{ github.run_id }}
          restore-keys: baseball-heights-

      - name: Pull missing batter heights (MLB Stats API)
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'baseball') }}
        run: uv run python -c "from ingest.baseball.pull import pull_heights; pull_heights()"

      - name: Save batter heights
        if: ${{ steps.sel.outputs.go == 'true' && contains(steps.sel.outputs.sports, 'baseball') && steps.heights.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw/batter_heights.parquet
          key: baseball-heights-${{ github.run_id }}

      - name: Fast backtest (pull request)
        id: fast
        if: ${{ steps.sel.outputs.go == 'true' && github.event_name == 'pull_request' }}
        run: uv run python -m backtest.ci --fast --changed "${{ steps.sel.outputs.changed }}" --summary backtest-summary.md

      - name: Full backtest (main, weekly)
        id: full
        if: ${{ steps.sel.outputs.go == 'true' && github.event_name != 'pull_request' }}
        run: uv run python -m backtest.ci --write ${{ steps.sel.outputs.changed && format('--changed "{0}"', steps.sel.outputs.changed) || '' }} --summary backtest-summary.md

      - name: Summary and PR comment
        if: ${{ steps.sel.outputs.go == 'true' && !cancelled() && hashFiles('backtest-summary.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat backtest-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file backtest-summary.md --edit-last \
              || gh pr comment ${{ github.event.pull_request.number }} --body-file backtest-summary.md
          fi

      - name: Commit reports and the run log
        if: ${{ steps.sel.outputs.go == 'true' && !cancelled() && github.event_name != 'pull_request' && steps.full.outcome != 'skipped' }}
        run: |
          git config user.name "sparvi-bot"
          git config user.email "sparvi-bot@users.noreply.github.com"
          # Reports and the run log only; the site's model files are generated at render time (deploy.yml).
          git add models/*/*/backtest backtest/runs
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Backtest run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
