name: refresh-baseball

# In season: pull the night's games (incremental; a full re-pull on Mondays), rebuild every model
# and the dbt pipeline, commit the refreshed site data, and deploy. Off season: keep the raw-data
# cache from expiring.
# Each sport gets its own refresh workflow on its own calendar; they share deploy.yml.

on:
  schedule:
    - cron: "15 10 * 4-10 *"      # daily Apr-Oct, ~5 a.m. Central, after the night's games
    - cron: "0 9 * 1-3,11-12 1"   # Mondays Nov-Mar: touch the cache (GitHub evicts after 7 idle days)
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-pull the whole current season instead of only new games"
        type: boolean
        default: false
      rebuild:
        description: "Rebuild even if the raw data and code haven't changed since the last refresh"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-baseball
  cancel-in-progress: false

env:
  QUARTO_VERSION: "1.11.9"
# The keepalive cron string is repeated in the two `if:` conditions below (GitHub can't
# reference env in a job-level `if`); change all three together.

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 9 * 1-3,11-12 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # Push with the repo's deploy key, not GITHUB_TOKEN: main requires PRs with passing checks,
      # and on a personal repo the only actor that can be exempted for an unattended push is a
      # deploy key. The private key lives only in the SPARVI_DEPLOY_KEY secret.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SPARVI_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true

      - run: uv sync --frozen

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Seasons from sparvi.toml
        id: cfg
        run: |
          season=$(uv run python -m sparvi.config baseball.season)
          past=$(uv run python -m sparvi.config baseball.past_seasons)
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "key=baseball-raw-past-${past// /-}-v1" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            for y in $past; do echo "data/raw/*_${y}.parquet"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Past seasons never change, so they're cached under a fixed key. The current season has its
      # own cache, saved after every pull, so most runs only fetch new games. Raw Statcast is never
      # committed or published (rule 1).
      - name: Restore past-season raw data
        id: raw_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cfg.outputs.paths }}
          key: ${{ steps.cfg.outputs.key }}

      - name: Restore current-season raw data
        uses: actions/cache/restore@v6
        with:
          path: data/raw/*_${{ steps.cfg.outputs.season }}.parquet
          key: baseball-raw-cur-${{ steps.cfg.outputs.season }}-${{ github.run_id }}
          restore-keys: baseball-raw-cur-${{ steps.cfg.outputs.season }}-

      # Incremental by default: only games since the last one on file, plus a 3-day overlap because
      # Savant revises recent games. Mondays (and "full refresh" on a manual run) re-pull the whole
      # season to pick up older corrections.
      - name: Pull data
        run: |
          uv run python scripts/pull_data.py                      # fills any missing past season
          if [ "${{ inputs.full_refresh }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "Full re-pull of the current season"
            uv run python scripts/pull_data.py --current --refresh
          else
            uv run python scripts/pull_data.py --current --incremental
          fi

      # Saved right after the pull, not at the end of the job: a later failure (a model change, a
      # StaleProse check) shouldn't throw away an hour of downloading.
      - name: Save past-season raw data
        if: steps.raw_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cfg.outputs.paths }}
          key: ${{ steps.cfg.outputs.key }}

      - name: Save current-season raw data
        uses: actions/cache/save@v6
        with:
          path: data/raw/*_${{ steps.cfg.outputs.season }}.parquet
          key: baseball-raw-cur-${{ steps.cfg.outputs.season }}-${{ github.run_id }}

      # Training is repeatable on one machine but not bit-for-bit across CPU models, so rebuilding
      # unchanged data on a different runner can move published numbers in the last digits. Skip the
      # rebuild when the raw data and code match what the last refresh built from.
      - name: Did the inputs change?
        id: inputs
        run: |
          if [ "${{ inputs.rebuild }}" != "true" ] && uv run python scripts/build_fingerprint.py --check; then
            echo "Raw data and code are unchanged since the last refresh; nothing to rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild models, pipeline, and site
        if: steps.inputs.outputs.changed == 'true'
        run: uv run ./build.sh

      # Same data must give the same model. Retrain the out-of-sample test (one season, ~2 min) and
      # require byte-identical outputs; a failure here means training stopped being repeatable and
      # published numbers would drift between refreshes on unchanged data.
      - name: Check training is repeatable
        if: steps.inputs.outputs.changed == 'true'
        run: |
          echo "CPU: $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          o=baseball/pitch_quality/output
          sha256sum $o/robustness.json $o/metrics_location.json $o/yoy_pairs.csv > /tmp/first.sha
          uv run python baseball/pitch_quality/robustness.py > /dev/null
          sha256sum -c /tmp/first.sha

      - name: Commit refreshed data
        if: steps.inputs.outputs.changed == 'true'
        run: |
          git config user.name "sparvi-bot"
          git config user.email "sparvi-bot@users.noreply.github.com"
          uv run python scripts/build_fingerprint.py --write   # what this build was made from
          # Everything the build regenerates: data, prose numbers, model outputs, listing thumbnails.
          git add site/data/baseball site/_generated/baseball.yml baseball/*/output site/baseball/*/thumb.png \
            baseball/build_inputs.sha256
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Baseball data refresh $(date -u +%Y-%m-%d)"
          git status --short  # anything left unstaged is listed here; --autostash keeps it from blocking the rebase
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  keep-cache-warm:
    if: github.event.schedule == '0 9 * 1-3,11-12 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache key from sparvi.toml
        id: cfg
        run: |
          # sparvi.config is stdlib-only, so the runner's Python is enough; no dependency install.
          past=$(python3 -m sparvi.config baseball.past_seasons)
          echo "season=$(python3 -m sparvi.config baseball.season)" >> "$GITHUB_OUTPUT"
          echo "key=baseball-raw-past-${past// /-}-v1" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            for y in $past; do echo "data/raw/*_${y}.parquet"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Restoring counts as use, which resets the 7-day eviction clock.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cfg.outputs.paths }}
          key: ${{ steps.cfg.outputs.key }}
      - name: Touch the current-season cache too
        uses: actions/cache/restore@v6
        with:
          path: data/raw/*_${{ steps.cfg.outputs.season }}.parquet
          key: baseball-raw-cur-${{ steps.cfg.outputs.season }}-keepalive
          restore-keys: baseball-raw-cur-${{ steps.cfg.outputs.season }}-
