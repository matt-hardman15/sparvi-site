name: check

# Runs on every pull request. main is protected: these three jobs must pass before a merge.
# Nothing here needs real Statcast data: the pipeline runs on a synthetic fixture and the
# site renders from the aggregated JSON already committed in site/data.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.11.9"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Config, dbt pipelines on synthetic data (baseball, football), incremental pull, Rule 5 logic, published snapshots, training repeatability, refresh fingerprint, ingest data checks, raw snapshots, college football
        run: uv run pytest -q tests/test_config.py tests/test_fingerprint.py tests/test_workflows.py tests/test_ingest_checks.py tests/test_raw_snapshots.py tests/test_seo.py tests/test_pipeline.py tests/test_pull_incremental.py tests/test_rule5.py tests/test_snapshots.py tests/test_training.py tests/test_football.py tests/test_cfb.py

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}
      - run: cd site && quarto render
      - run: uv run playwright install --with-deps chromium
      - name: Load every page, use every control, fail on console errors
        run: uv run pytest -q tests/test_site.py
