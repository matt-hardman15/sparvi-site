name: check

# Runs on every pull request. main is protected: these three jobs must pass before a merge.
# Nothing here needs real Statcast data: the pipeline runs on a synthetic fixture and the
# site renders from the aggregated JSON already committed in site/data.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read    # the `changes` job lists the pull request's files

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.11.9"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Config, dbt pipelines on synthetic data (baseball, football), incremental pull, Rule 5 logic, published snapshots, training repeatability, refresh fingerprint, ingest data checks, raw snapshots, college football, plausibility tests on the committed site data
        run: uv run pytest -q tests/test_config.py tests/test_fingerprint.py tests/test_workflows.py tests/test_registry.py tests/test_backtest.py tests/test_ingest_checks.py tests/test_raw_snapshots.py tests/test_seo.py tests/test_player_pages.py tests/test_team_pages.py tests/test_structured_data.py tests/test_page_scripts.py tests/test_links.py tests/test_phase2.py tests/test_pipeline.py tests/test_pull_incremental.py tests/test_rule5.py tests/test_snapshots.py tests/test_training.py tests/test_football.py tests/test_fourth_decide.py tests/test_fourth_transforms.py tests/test_fourth_grid.py tests/test_fourth.py tests/test_cfb.py tests/test_cbb_model.py tests/test_cbb_daily.py tests/test_cbb_pages.py tests/test_ledger.py tests/test_plausibility.py tests/test_plausibility_baseball.py tests/test_plausibility_cfb.py tests/test_plausibility_cbb.py
      # Ledger lines arrive only by an Actions push to main (sparvi/ledger.py). A pull request may not
      # change, remove, or add one; ledger.yml checks the Actions pushes themselves.
      - name: Forecast ledger is append-only and untouched by this pull request
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref || 'main' }}
          uv run python -m sparvi.ledger check --base FETCH_HEAD --pr

  # Does this pull request touch anything the rendered site depends on? If not, `site` (render every page + browser
  # test, most of this workflow's time) is skipped; a skipped job still satisfies the required check. The list is
  # generous on purpose, and tests/test_workflows.py pins it. deploy.yml renders everything on merge either way.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.files.outputs.site }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Site source, data and build scripts; the shared package and config; dependencies; every exporter and
          # page builder; the browser test; this workflow.
          SITE_PATHS: '^(site/|sparvi/|football/common/|sparvi\.toml$|pyproject\.toml$|uv\.lock$|\.python-version$|build\.sh$|\.github/workflows/check\.yml$|tests/(test_site|conftest)\.py$|(.*/)?export_site_data\.py$|(nfl|cfb)/team_pages\.py$|cfb/thumb\.py$)'
        run: |
          if [ -z "$PR" ]; then echo "site=true" >> "$GITHUB_OUTPUT"; exit 0; fi   # run by hand: check everything
          # GitHub sometimes answers 500 ("diff temporarily unavailable") right after a push: retry before failing
          # (on failure `site` runs anyway).
          ok=""
          for i in 1 2 3 4 5; do
            if gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt; then ok=1; break; fi
            echo "files API failed (attempt $i); retrying in $((i * 15))s"; sleep $((i * 15))
          done
          [ -n "$ok" ] || { echo "could not list the pull request's files"; exit 1; }
          echo "$(wc -l < files.txt) files changed"
          if grep -E "$SITE_PATHS" files.txt; then echo "site=true" >> "$GITHUB_OUTPUT"; else echo "site=false" >> "$GITHUB_OUTPUT"; fi

  site:
    needs: changes
    # Also runs when `changes` itself failed: a skipped job counts as passing, so never skip on an error.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tags after v7)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}
      - run: uv run python -m sparvi.registry export     # generated at render time, not committed
      - run: cd site && uv run quarto render      # post-render steps need the project's Python (Pillow)
      - run: uv run playwright install --with-deps chromium
      - name: Load every page, use every control, fail on console errors
        run: uv run pytest -q tests/test_site.py
      # External links (PLAN-seo S5): reported, never failing; other sites go down. Internal links are checked,
      # and fail the build, in the render itself (site/build/linkcheck.py).
      - name: External links (report only)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --no-progress --scheme https --scheme http --exclude '^https://sparvi\.io' --max-concurrency 8 --timeout 20 'docs/**/*.html'
          fail: false
          jobSummary: true
