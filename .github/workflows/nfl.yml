name: nfl

# In season: pull nflverse play-by-play (every season in sparvi.toml [nfl]; it takes ~30 seconds),
# rebuild the football dbt project, the opponent adjustment, the export, and the team pages, commit
# the NFL site data, and deploy. Its own workflow, so a failure here never blocks baseball.

on:
  schedule:
    - cron: "15 12 * 1-2,9-12 2"   # Tuesdays Sep-Feb, after Monday night's game and nflverse's nightly update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl
  cancel-in-progress: false

env:
  QUARTO_VERSION: "1.11.9"

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 240   # a first run, or one after nflverse revises past seasons, recomputes every season's fourth-down decisions
    steps:
      # Pushes with the deploy key (the one actor the main-branch ruleset exempts); see refresh-baseball.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ssh-key: ${{ secrets.SPARVI_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}

      # nflverse data is CC-BY 4.0. Raw play-by-play is never committed or published.
      - name: Pull nflverse data
        run: uv run python ingest/nfl/pull.py

      # Data checks (ingest/nfl/checks.py, contracts/nfl_ingest.yml) before anything is built. On a
      # failure nothing is rebuilt: the site keeps the last good data, the failure is committed to
      # site/data/status/nfl.json (shown on /status/), and the run ends red.
      - name: Data checks
        id: checks
        run: |
          if uv run python -m ingest.nfl.checks; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      # Append-only snapshot of what this pull returned (ingest/snapshot.py, private R2 bucket): only
      # rows that are new, changed, or gone since the last snapshot. Snapshots can't be made after the
      # fact, so a failure here doesn't stop the site update but does turn the run red (last step).
      - name: Snapshot raw data
        id: snapshot
        if: steps.checks.outputs.ok == 'true'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m ingest.snapshot nfl --require

      # Past seasons' fourth-down decision rows (play-level, never committed): reused when their inputs are unchanged
      # (nfl/fourth/decisions.py checks a fingerprint per season), so most weeks only the current season is recomputed.
      - name: Restore fourth-down decision rows
        if: steps.checks.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            nfl/fourth/output/decisions_*.parquet
            nfl/fourth/output/grid_*.json
          key: nfl-fourth-decisions-${{ github.run_id }}
          restore-keys: nfl-fourth-decisions-

      - name: Rebuild football pipeline, adjustment, fourth-down decisions, export, team pages
        id: build
        if: steps.checks.outputs.ok == 'true'
        run: uv run nfl/build.sh

      - name: Save fourth-down decision rows
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            nfl/fourth/output/decisions_*.parquet
            nfl/fourth/output/grid_*.json
          key: nfl-fourth-decisions-${{ github.run_id }}

      # Plausibility tests (plausibility/nfl.py) on what the build produced: can the numbers each tool shows be
      # true? Like a failed data check, a failure publishes nothing: the rebuilt data is not committed, the site keeps
      # the last data that passed, the failure is committed to site/data/status/nfl_plausibility.json (shown on
      # /status/), and the run ends red.
      - name: Plausibility tests
        id: plausibility
        if: steps.build.outcome == 'success'
        run: |
          if uv run python -m plausibility nfl; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Render (fails on unresolved prose numbers)
        id: render
        if: steps.plausibility.outputs.ok == 'true'
        run: |
          cd site && quarto render && cd ..
          if grep -rl "?meta:" docs --include=*.html; then echo "unresolved prose numbers"; exit 1; fi

      # The data-check and plausibility status every run; the rebuilt data only when the build, the plausibility
      # tests, and the render passed.
      - name: Commit refreshed data
        if: ${{ !cancelled() && steps.checks.outcome == 'success' && steps.build.outcome != 'failure' && steps.render.outcome != 'failure' }}
        run: |
          git config user.name "sparvi-bot"
          git config user.email "sparvi-bot@users.noreply.github.com"
          git add site/data/status/nfl.json
          if [ "${{ steps.plausibility.outcome }}" = "success" ]; then git add site/data/status/nfl_plausibility.json; fi
          if [ "${{ steps.plausibility.outputs.ok }}" = "true" ]; then
            git add site/data/nfl site/_generated/nfl.yml nfl/*/output site/nfl/teams
          fi
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "NFL data refresh $(date -u +%Y-%m-%d)"
          git status --short
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Fail the run if a data check failed
        if: steps.checks.outputs.ok == 'false'
        run: |
          echo "::error::NFL data checks failed; the site still serves the last good data. See /status/."
          exit 1

      - name: Fail the run if a plausibility test failed
        if: steps.plausibility.outputs.ok == 'false'
        run: |
          echo "::error::NFL plausibility tests failed; the rebuilt data was not published. See /status/."
          exit 1

      - name: Fail the run if the snapshot failed
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "::error::The raw-data snapshot failed (the site was still updated). Rerun the workflow so today's data is recorded."
          exit 1

  # No deploy job here: the data commit above is pushed with the deploy key, and that push runs deploy.yml
  # (a failed data check still commits the status file, so /status/ shows it). Nothing pushed = nothing to deploy.
