# Model card (PLAN-scout A2). Change `code` files only with a new version: python -m sparvi.registry --help
name: stuff_plus
title: Stuff+
sport: baseball
status: champion
version: 2.0.1
owner: Matt
spec: 'What the ball does: velocity, movement, spin, release, and arm angle, relative to the pitcher''s primary
  fastball. No location, no count.'
target: Pitcher run value of the pitch (rv, denoised on balls in play), scaled to 100 = prior-season MLB average
method: 'LightGBM per pitch group (fastball, breaking, offspeed), each a bag of 10 models: pitchers split into 10
  folds, model f trains on the other nine and early-stops on fold f, predictions averaged. Learning rate 0.005;
  fold split seed 7, member seeds 700-709; deterministic. Seed sensitivity: baseball/pitch_quality/stability.py'
code:
- baseball/pitch_quality/train.py
- baseball/pitch_quality/features.py
training_data:
- data/raw/statcast_mlb_*.parquet
- data/raw/batter_heights.parquet
artifacts:
- baseball/pitch_quality/output/models/stuff_*.txt
- baseball/pitch_quality/output/scale_reference.json
validation:
  file: baseball/pitch_quality/output/metrics_location.json
  metrics:
    r_next_rv: yoy.r_next_rv.stuff.r
    r_self: yoy.r_self.stuff
    split_half: split_half.stuff
    aaa_to_mlb: aaa_to_mlb.stuff
    holdout_pitch_r2: holdout_pitch_r2.stuff
eval:
  set: 'Out-of-sample year over year: models refit on the earliest season only, grade the next season, and correlate
    with the season after''s run value (MLB pitchers with enough pitches both years). Same split as the published
    Stuff+ validation.'
  set_keys:
    train_season: seasons.train
    predictor_season: seasons.predictor
    outcome_season: seasons.outcome
    min_pitches: min_pitches
  primary: r_next_rv
  higher_is_better: true
live_window:
  unit: weeks in season
  min: 4
published_in:
- site/data/baseball/*.json
- baseball/stuff-plus
- baseball/stuff-or-command
- baseball/tools/stuff-leaderboard
- baseball/player
- baseball/tools/rule-5
backtest:
  preregistered_at: '2026-11-13'
  amended:
  - date: '2026-11-19'
    change: 'train_window 1 -> 2 (Matt): the test trains on two seasons, as the published model does. Made after
      the one-season result on 2026 was seen (run 063ae43be446, 2026-11-18: r 0.307 vs. 0.193 for last season''s
      results, passed). The choice of two seasons comes from development folds that never read 2026 (baseball/pitch_quality/output/development_windows.json:
      outcomes 2024 and 2025, two seasons +0.040 in r over one, 90% interval +0.020 to +0.063). Target, baseline,
      metric, gate, seed and test season are unchanged.'
  module: models/baseball/stuff_plus/backtest.py
  target: Next-season run value per 100 pitches (RV/100), MLB pitchers with 500+ pitches in both seasons
  decision_dates: season start (March 1 of the outcome season)
  splits:
    type: walk_forward
    first_test: 2026
    last_test: 2026
    train_window: 2
    predictor_lag: 1
    decision: 03-01
    fast_folds: 1
  group_by: 'none: a pitch-physics model; pitcher identity is not a feature (same design as the published test)'
  block: entity_id
  baselines:
  - last_season
  primary_metric: pearson_r
  bootstrap: 2000
  seed: 7
  pass_gate:
    beats_baseline: last_season
    min_skill: 0.0
    ci_excludes_zero: true
  gate_decided: 'Matt, 2026-11-13: strict (the 90% interval of the edge over last season''s run value must exclude
    zero)'
  reproduction: Exact on the same machine; across CPU models LightGBM trees differ slightly, tolerance ±0.01 in
    r (Matt, 2026-11-13). Official runs happen in CI.
  vault:
    seasons: []
    note: 'No sealed season yet: with MLB 2024-2026 the only test season is 2026. The 2027 season becomes the vault
      when it completes.'
    accesses: 0
experimental: 'this version has no passing backtest on record. Shown in two cases. Right after a new version: the
  backtest workflow reruns the test on main and the label goes away when its report lands (2.0.1 changed shared
  training code only; its Stuff+ models are identical to 2.0.0''s, which passed). Or the latest run didn''t clear
  the strict gate: the gate asks that the 90% interval of the edge over last season''s results exclude zero, and
  with about 320 pitchers that interval is wide enough for a rerun on revised data to fall back under it'
challengers: []
history:
- version: 1.0.1
  status: retired
  until: '2026-11-14'
