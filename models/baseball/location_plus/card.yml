# Model card (PLAN-scout A2). Change `code` files only with a new version: python -m sparvi.registry --help
name: location_plus
title: Location+
sport: baseball
status: champion
version: 3.0.1
owner: Matt
spec: 'What the location added to the pitch: the Pitching+ model''s prediction (shape, count, batter side and where
  the pitch crossed the plate, mirrored for batter handedness, height-based zone) minus the prediction of the same
  model without the two location inputs, averaged over a pitcher''s pitches.'
target: Pitcher run value of the pitch (rv, denoised on balls in play), scaled to 100 = prior-season MLB average
method: 'Two LightGBM model families per pitch group (fastball, breaking, offspeed), each a bag of 10 models: pitchers
  split into 10 folds, model f trains on the other nine and early-stops on fold f, predictions averaged. The full
  model is the Pitching+ model; the second sees the same inputs without location. Learning rate 0.03 for both; fold
  split seed 7, member seeds 700-709; deterministic. Seed sensitivity (baseball/pitch_quality/stability.py) is higher
  than for the other grades because the grade is a difference of two models: mean 0.74 points, 26% of pitchers move
  more than 1 (row LOC-STABLE).'
code:
- baseball/pitch_quality/train.py
- baseball/pitch_quality/features.py
training_data:
- data/raw/statcast_mlb_*.parquet
- data/raw/batter_heights.parquet
artifacts:
- baseball/pitch_quality/output/models/pitching_*.txt
- baseball/pitch_quality/output/models/no_loc_*.txt
- baseball/pitch_quality/output/scale_reference.json
validation:
  file: baseball/pitch_quality/output/metrics_location.json
  metrics:
    r_next_rv: yoy.r_next_rv.loc.r
    r_self: yoy.r_self.loc
    split_half: split_half.loc
    aaa_to_mlb: aaa_to_mlb.loc
    holdout_pitch_r2: holdout_pitch_r2.loc
eval:
  set: 'Out-of-sample year over year: models refit on the earliest season only, grade the next season, and correlate
    with the season after''s run value (MLB pitchers with enough pitches both years). Same split as the published
    Stuff+ validation.'
  set_keys:
    train_season: seasons.train
    predictor_season: seasons.predictor
    outcome_season: seasons.outcome
    min_pitches: min_pitches
  primary: r_next_rv
  higher_is_better: true
live_window:
  unit: weeks in season
  min: 4
published_in:
- site/data/baseball/*.json
- baseball/stuff-plus
- baseball/stuff-or-command
- baseball/tools/stuff-leaderboard
- baseball/player
- baseball/tools/rule-5
backtest:
  preregistered_at: '2026-11-19'
  candidate: 4.0.0
  candidate_spec: 'Location value given shape: the prediction of a model on shape, count, batter side and location,
    minus the prediction of the same model without location, averaged over a pitcher''s pitches. Chosen on development
    folds that never read 2026 (baseball/pitch_quality/output/development_location.json: outcomes 2024 and 2025;
    r with next-season RV/100 +0.147, 90% interval +0.077 to +0.210, against +0.030 for the published features).
    train.py is unchanged until this test passes; the report is written as 3.0.0 and does not validate the published
    version.'
  candidate_training: '4.0.0 (registered 2026-11-24, LOC-STABLE): the same grade with both models trained at learning
    rate 0.005 in bags of 20 (3.0.x: 0.03, bags of 10), so that it moves less between training seeds. Chosen on
    development folds that never read 2026 (baseball/pitch_quality/output/development_location_stability.json, outcomes
    2024 and 2025, two seeds, run on GitHub''s runners): mean movement between seeds 0.29 Location+ points with
    2% of pitchers over 1, against 0.70 and 24% for the 3.0.x training; r with next-season RV/100 0.139 against
    0.140. The gate statistic on those folds at seed 7: edge over the location-only features +0.071 (90% interval
    +0.011 to +0.126) and +0.147 (+0.091 to +0.204), passing the strict gate on both. Against the 3.0.x training
    on the same pitchers the edge was -0.011 (-0.020 to -0.003) on one fold and +0.006 (-0.001 to +0.013) on the
    other: no consistent difference, and smaller than the 3.0.x training''s own spread between seeds (r 0.131 to
    0.143 on the first fold). train.py is unchanged until this test passes; the report is written as 4.0.0 and does
    not validate the published version.'
  module: models/baseball/location_plus/backtest.py
  target: Next-season run value per 100 pitches (RV/100), MLB pitchers with 500+ pitches in both seasons
  decision_dates: season start (March 1 of the outcome season)
  splits:
    type: walk_forward
    first_test: 2026
    last_test: 2026
    train_window: 2
    predictor_lag: 1
    decision: 03-01
    fast_folds: 1
  group_by: 'none: a pitch-level model; pitcher identity is not a feature'
  block: entity_id
  baselines:
  - published_location
  - stuff
  - last_season
  - v3_setup
  primary_metric: pearson_r
  report_partial_given: stuff
  bootstrap: 2000
  seed: 7
  pass_gate:
    beats_baseline: published_location
    min_skill: 0.0
    ci_excludes_zero: true
  gate_decided: 'Matt, 2026-11-19: strict (the 90% interval of the edge must exclude zero), measured against the
    published Location+ features trained on the same fold. The partial correlation with next-season RV/100 given
    Stuff+ is reported with its interval and is not part of the gate. Chosen with the development folds in view
    (baseball/pitch_quality/output/development_location_gates.json): a gain in r over Stuff+ alone could not pass
    at this sample size (about +0.015 on a partial r of 0.10). Stuff+ and last season''s results are reported baselines.'
  reproduction: Exact on the same machine; across machines tolerance ±0.01 in r (Matt, 2026-11-13). Official runs
    happen in CI.
  vault:
    seasons: []
    note: 'No sealed season yet: the only test season is 2026. The 2027 season becomes the vault when it completes.'
    accesses: 0
  amended: '2026-11-23: the `candidate: 3.0.0` line is removed. 3.0.0 passed this block and was promoted on Nov
    20, so the block now tests the published version; nothing else in it changed. (3.0.1 is the same model, stored
    instead of refit.) `candidate_spec` stays as the record of how the spec was chosen.

    2026-11-24 (Matt chose the candidate): `candidate: 4.0.0` and `candidate_training` are added, and the module
    now trains both models at learning rate 0.005 in bags of 20. The target, fold, sample, gate and its baseline
    are unchanged: the candidate must beat the location-only features (`published_location`, the features of Location+
    2.0.0) with the edge''s 90% interval above zero. One reported baseline is added, `v3_setup`: the same grade
    trained as 3.0.x trains it, on the same fold. It is the direct comparison and is not part of the gate: the change
    is made for seed stability, which this test does not measure (stability.py does, after the change), and on the
    development folds the two trainings'' r differed by less than the seed spread. The 2026 outcomes have been read
    once already, by 3.0.0''s test of this block (r 0.157). This is a second registered test on that season; the
    candidate and its training were chosen without it.'
challengers: []
history:
- version: 1.0.1
  status: retired
  until: '2026-11-14'
- version: 2.0.0
  status: retired
  until: '2026-11-20'
promotion_exception: '2.0.0 promoted on 2026-11-14 by Matt''s decision although its frozen-set r_next_rv (0.0077)
  is below 1.0.1''s (0.0116): the gap is inside the +-0.01 reproduction tolerance, 1.0.1''s value was itself seed
  noise, and 2.0.0 removes the seed instability shared with Stuff+ (same train.py).'
