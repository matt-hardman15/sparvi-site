# Model card (PLAN-scout A2). Change `code` files only with a new version: python -m sparvi.registry --help
name: location_plus
title: Location+
sport: baseball
status: champion
version: 1.0.0
owner: Matt
spec: Where the pitch crossed the plate (mirrored for batter handedness, height-based zone) in the count. No velocity
  or movement.
target: Pitcher run value of the pitch (rv, denoised on balls in play), scaled to 100 = prior-season MLB average
method: LightGBM regressor per pitch group (fastball, breaking, offspeed), seed 7, deterministic
code:
- baseball/pitch_quality/train.py
- baseball/pitch_quality/features.py
training_data:
- data/raw/statcast_mlb_*.parquet
- data/raw/batter_heights.parquet
artifacts:
- baseball/pitch_quality/output/model_loc_fastball.txt
- baseball/pitch_quality/output/model_loc_breaking.txt
- baseball/pitch_quality/output/model_loc_offspeed.txt
- baseball/pitch_quality/output/scale_reference.json
validation:
  file: baseball/pitch_quality/output/metrics_location.json
  metrics:
    r_next_rv: yoy.r_next_rv.loc.r
    r_self: yoy.r_self.loc
    split_half: split_half.loc
    aaa_to_mlb: aaa_to_mlb.loc
    holdout_pitch_r2: holdout_pitch_r2.loc
eval:
  set: 'Out-of-sample year over year: models refit on the earliest season only, grade the next season, and correlate
    with the season after''s run value (MLB pitchers with enough pitches both years). Same split as the published
    Stuff+ validation.'
  set_keys:
    train_season: seasons.train
    predictor_season: seasons.predictor
    outcome_season: seasons.outcome
    min_pitches: min_pitches
  primary: r_next_rv
  higher_is_better: true
live_window:
  unit: weeks in season
  min: 4
published_in:
- site/data/baseball/*.json
- baseball/stuff-plus
- baseball/stuff-or-command
- baseball/tools/stuff-leaderboard
- baseball/player
- baseball/tools/rule-5
