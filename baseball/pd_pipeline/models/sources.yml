version: 2

# Table names are season-relative; `identifier` resolves them to files using the
# `season` var, which build.sh passes from sparvi.toml. The env vars let CI point
# the pipeline at a synthetic fixture instead of real (uncommitted) Statcast data.
sources:
  - name: savant
    description: Pitch-level Statcast pulled by scripts/pull_data.py
    meta:
      external_location: "{{ env_var('SPARVI_RAW_DIR', '../../data/raw') }}/{identifier}.parquet"
    tables:
      - name: statcast_aaa_prev
        identifier: "statcast_aaa_{{ var('season') - 1 }}"
      - name: statcast_aaa_cur
        identifier: "statcast_aaa_{{ var('season') }}"
      # MLB: the same three seasons the Stuff+ model uses (mlb_seasons = 3 in sparvi.toml).
      - name: statcast_mlb_prev2
        identifier: "statcast_mlb_{{ var('season') - 2 }}"
      - name: statcast_mlb_prev
        identifier: "statcast_mlb_{{ var('season') - 1 }}"
      - name: statcast_mlb_cur
        identifier: "statcast_mlb_{{ var('season') }}"
      - name: milb_players_cur
        identifier: "milb_players_{{ var('season') }}"

  - name: pitch_quality
    description: Pitch-type Stuff+ grades written by pitch_quality/train.py
    meta:
      external_location: "{{ env_var('SPARVI_PQ_DIR', '../pitch_quality/output') }}/{identifier}.csv"
    tables:
      - name: pitch_type_aaa_cur
        identifier: "pitch_type_aaa_{{ var('season') }}"
      - name: scale_reference
        description: Frozen prior-season Stuff+ scale (mean, SD) written by train.py
        identifier: scale_reference

  - name: pitch_predictions
    description: Pitch-level Stuff+ predictions from train.py (internal; gitignored, never exported)
    meta:
      external_location: "{{ env_var('SPARVI_PQ_DIR', '../pitch_quality/output') }}/{identifier}.parquet"
    tables:
      - name: pred_mlb_cur
        identifier: "pitch_predictions_mlb_{{ var('season') }}"
      - name: pred_aaa_cur
        identifier: "pitch_predictions_aaa_{{ var('season') }}"
