version: 2

models:
  - name: stg_pitches
    description: One row per Triple-A regular-season pitch with swing/contact flags.
    columns:
      - name: pitch_id
        tests: [unique, not_null]
      - name: pitcher_id
        tests: [not_null]
      - name: batter_id
        tests: [not_null]

  - name: int_pitcher_appearances
    description: One row per pitcher per game, both levels.
    tests:
      - unique_combination:
          arguments:
            columns: [level, game_pk, pitcher_id]
    columns:
      - name: level
        tests:
          - accepted_values:
              arguments:
                values: ['AAA', 'MLB']

  - name: dim_pitcher_role
    description: Starter/reliever role per pitcher, level, and season.
    tests:
      - unique_combination:
          arguments:
            columns: [level, season, pitcher_id]
    columns:
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SP', 'RP', 'Swing']
      - name: start_share
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_hitter_report
    description: Season and trailing-window hitter profile with Triple-A percentiles.
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: chase_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_pitcher_report
    description: Season and trailing-window pitcher profile with Triple-A percentiles.
    columns:
      - name: player_id
        tests: [unique, not_null]

  - name: fct_pitcher_arsenal
    description: Pitch-type arsenal with Stuff+ and recent shape change.
    tests:
      - unique_combination:
          arguments:
            columns: [player_id, pitch_type]

  - name: rpt_flags
    description: Today's change flags for the affiliate roster.

  - name: int_mlb_debuts
    description: First MLB game per player, side (hitter/pitcher), and season.
    tests:
      - unique_combination:
          arguments:
            columns: [side, season, player_id]

  - name: fct_translation_lines
    description: Season and pre-debut lines for the Triple-A -> MLB translation, both levels, last two seasons.
    tests:
      - unique_combination:
          arguments:
            columns: [side, player_id, season, level, segment]
    columns:
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['full', 'pre_debut']

  - name: int_snapshot_dates
    description: Weekly snapshot dates (last game on or before each Sunday) plus the final day, per level.
    tests:
      - unique_combination:
          arguments:
            columns: [level, snapshot_date]

  - name: fct_pitcher_snapshots
    description: Pitcher x snapshot x window (std, last30); final std snapshot = season-level marts.
    tests:
      - unique_combination:
          arguments:
            columns: [level, snapshot_date, window_name, pitcher_id]
    columns:
      - name: k_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: bb_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: csw_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: whiff_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: chase_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: zone_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: hard_hit_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: xwoba_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_hitter_snapshots
    description: Hitter x snapshot x window (std, last30), both levels.
    tests:
      - unique_combination:
          arguments:
            columns: [level, snapshot_date, window_name, batter_id]
    columns:
      - name: chase_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: zone_swing_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: zone_contact_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: whiff_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: k_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: bb_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: hard_hit_pct_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: ev90_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: xwoba_pctl
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_pitch_type_snapshots
    description: Pitcher x pitch type x snapshot, season to date.
    tests:
      - unique_combination:
          arguments:
            columns: [level, snapshot_date, pitcher_id, pitch_type]
