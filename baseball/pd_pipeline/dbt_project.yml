name: pd_pipeline
version: "1.0.0"
config-version: 2
profile: pd_pipeline

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# `season`, `as_of_date` (Triple-A) and `as_of_date_mlb` have no defaults on purpose: build.sh
# passes them, with the season from sparvi.toml and each as-of = the last game at that level.
# A run without them fails.
vars:
  affiliate: "ALL"          # a Savant team code (e.g. "OMA") or ALL
  # Pitcher roles (dim_pitcher_role). The glossary quotes these via the export.
  role_sp_min_share: 0.5    # SP: at least half of his games are starts...
  role_sp_min_starts: 3     # ...and at least this many starts
  role_rp_max_share: 0.2    # RP: at most this share of games are starts; otherwise Swing
  # Snapshots (fct_*_snapshots): weekly (last game on or before each Sunday) plus the final day.
  last_days: 30             # the trailing window shown by the "last 30 days" toggle
  # Qualified pool as of date d = full-season minimum x (team games played by d / full schedule),
  # never below the floor. The season-level marts use the same rule at their as-of date, so the
  # final snapshot and the marts agree exactly.
  full_season_games: {MLB: 162, AAA: 150}
  min_qualified_floor: 25
  trend_days: 14             # recent window compared against season-to-date
  min_pa_qualified: 150      # league percentile pool, hitters
  min_bf_qualified: 150      # league percentile pool, pitchers
  # The strike zone behind in_zone (chase, zone swing, zone contact, zone rate). Statcast's `zone`
  # follows sz_top/sz_bot, which were set from the batter's stance per pitch for MLB before 2026 and
  # from listed height after (Triple-A: height in every season we use). Defining it from height for
  # every season and level keeps one zone; it matches Statcast's own flag 99.6% where Statcast
  # already uses height. Shares must equal ZONE_TOP/ZONE_BOT in pitch_quality/features.py (tested).
  zone_top_share: 0.535      # top of the zone, share of listed height
  zone_bot_share: 0.27       # bottom of the zone
  zone_half_width_ft: 0.83   # half the plate (8.5 in) plus a ball radius
  ball_radius_ft: 0.12       # a pitch touching the top or bottom edge counts

models:
  pd_pipeline:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

flags:
  send_anonymous_usage_stats: false
