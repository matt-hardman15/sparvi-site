name: pd_pipeline
version: "1.0.0"
config-version: 2
profile: pd_pipeline

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  season: 2026
  affiliate: "ALL"          # a Savant team code (e.g. "OMA") or ALL
  as_of_date: "2026-09-20"   # the "today" a daily run is built for
  trend_days: 14             # recent window compared against season-to-date
  min_pa_qualified: 150      # league percentile pool, hitters
  min_bf_qualified: 150      # league percentile pool, pitchers

models:
  pd_pipeline:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

flags:
  send_anonymous_usage_stats: false
