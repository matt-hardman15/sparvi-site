project:
  type: website
  output-dir: ../docs
  resources:
    - assets/**
    - data/**
    - CNAME
  # Canonical URLs, sitemap lastmod from git, sitemap index, robots.txt, and metadata checks.
  post-render:
    - build/seo.py

# Numbers quoted in article prose, written by each sport's export_site_data.py.
# Use them as {{< meta baseball.<key> >}}; never hand-type a number into an article.
metadata-files:
  - _generated/baseball.yml
  - _generated/nfl.yml
  - _generated/cfb.yml
  - _generated/models.yml

website:
  title: "Sparvi"
  site-url: "https://sparvi.io"
  description: "Free sports analytics: findings you can act on, with the data out in the open so you can check them."
  favicon: assets/favicon.svg
  # Social previews: pages with an `image` (articles' thumb.png, NFL team pages' preview.png) share it.
  # Pages without their own image (tools, hubs, glossary, about) share this one.
  image: assets/og-default.png
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: Baseball
        href: baseball/index.qmd
      - text: NFL
        href: nfl/index.qmd
      - text: College Football
        href: cfb/index.qmd
      - text: Tools
        menu:
          - text: Baseball
          - text: Pitch-grade leaderboard
            href: baseball/tools/stuff-leaderboard.qmd
          - text: Triple-A explorer
            href: baseball/tools/triple-a.qmd
          - text: Rule 5 board
            href: baseball/tools/rule-5.qmd
          - text: Farm-system scores
            href: baseball/farm-systems/index.qmd#x2
          - text: "---"
          - text: NFL
          - text: Team efficiency
            href: nfl/tools/team-efficiency.qmd
          - text: "---"
          - text: College Football
          - text: Team ratings
            href: cfb/tools/team-ratings.qmd
      - text: Glossary
        href: glossary.qmd
      - text: About
        href: about.qmd
  page-footer:
    left: "Sparvi · Free and independent. Baseball data: Baseball Savant and the MLB Stats API. NFL data: nflverse (CC-BY 4.0). College football data provided by CollegeFootballData.com. Sparvi is not affiliated with MLB, the NFL, the NCAA, or any club or school."
    right: "[Data status](/status.html) · [About](/about.html)"

format:
  html:
    theme: default
    css: assets/css/sparvi.css
    minimal: false
    toc: false
    html-math-method: plain
    anchor-sections: false
    smooth-scroll: false
    # Quarto's own metadata partial, an early data preload, and the deferred chart libraries
    # (see _partials/metadata.html).
    template-partials:
      - _partials/metadata.html
