project:
  type: website
  output-dir: ../docs
  resources:
    - assets/**
    - data/**
    - CNAME

# Numbers quoted in article prose, written by each sport's export_site_data.py.
# Use them as {{< meta baseball.<key> >}}; never hand-type a number into an article.
metadata-files:
  - _generated/baseball.yml
  - _generated/nfl.yml

website:
  title: "Sparvi"
  site-url: "https://sparvi.io"
  description: "Free sports analytics: findings you can act on, with the data out in the open so you can check them."
  favicon: assets/favicon.svg
  # Social previews: pages with an `image` (articles' thumb.png, NFL team pages' preview.png) share it.
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: Baseball
        href: baseball/index.qmd
      - text: NFL
        href: nfl/index.qmd
      - text: Tools
        menu:
          - text: Baseball
          - text: Pitch-grade leaderboard
            href: baseball/tools/stuff-leaderboard.qmd
          - text: Triple-A explorer
            href: baseball/tools/triple-a.qmd
          - text: Rule 5 board
            href: baseball/tools/rule-5.qmd
          - text: "---"
          - text: NFL
          - text: Team efficiency
            href: nfl/tools/team-efficiency.qmd
      - text: Glossary
        href: glossary.qmd
      - text: About
        href: about.qmd
  page-footer:
    left: "Sparvi · Free and independent. Baseball data: Baseball Savant and the MLB Stats API. NFL data: nflverse (CC-BY 4.0). Sparvi is not affiliated with MLB, the NFL, or any club."
    right: "[About](/about.html)"

format:
  html:
    theme: default
    css: assets/css/sparvi.css
    minimal: false
    toc: false
    html-math-method: plain
    anchor-sections: false
    smooth-scroll: false
    # Quarto's own metadata partial plus an early data preload (see _partials/metadata.html).
    template-partials:
      - _partials/metadata.html
    include-in-header:
      - text: |
          <script src="/assets/js/d3.min.js"></script>
          <script src="/assets/js/plot.umd.min.js"></script>
          <script src="/assets/js/sparvi.js"></script>
