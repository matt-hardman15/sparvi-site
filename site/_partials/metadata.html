<!-- Quarto's default metadata partial (quarto-cli share/formats/html/pandoc/metadata.html), plus the
     early preload below. It renders before Quarto's CSS/JS, so the data download isn't held up by
     the stylesheets or by d3/Plot. Re-copy the default part if a Quarto upgrade changes it. -->
<meta charset="utf-8" />
$if(quarto-version)$
<meta name="generator" content="quarto-$quarto-version$" />
$else$
<meta name="generator" content="quarto" />
$endif$

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

$for(author-meta)$
<meta name="author" content="$author-meta$" />
$endfor$
$if(date-meta)$
<meta name="dcterms.date" content="$date-meta$" />
$endif$
$if(keywords)$
<meta name="keywords" content="$for(keywords)$$keywords$$sep$, $endfor$" />
$endif$
$if(description-meta)$
<meta name="description" content="$description-meta$" />
$endif$

<title>$pagetitle$$if(title-prefix)$ – $title-prefix$$endif$</title>

<!-- The two fonts every page uses above the fold (body text and headings), fetched with the HTML rather than after
     sparvi.css, so text doesn't reflow when they arrive (PERF-1: up to 0.23 layout shift on the leaderboard). -->
<link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/serif-700.woff2" as="font" type="font/woff2" crossorigin>

<!-- In this partial, a literal $$ is written $$$$ (Pandoc template syntax). -->
<script>
  // Start each data page's first downloads now, in parallel with d3 and Plot, instead of after
  // them. Only files the requested view will use: an unused preload logs a console warning.
  (function () {
    var q = new URLSearchParams(location.search), p = location.pathname, w = q.get("window") === "last30" ? "_last30" : "";
    var add = function (f) { var l = document.createElement("link"); l.rel = "preload"; l.as = "fetch";
      l.crossOrigin = "anonymous"; l.href = "/data/baseball/" + f; document.head.appendChild(l); };
    if (/\/tools\/triple-a(\.html)?$$/.test(p)) { add("meta.json"); add("snapshots_" + (q.get("side") || "hitters") + "_aaa" + w + ".json"); }
    else if (/\/tools\/stuff-leaderboard(\.html)?$$/.test(p)) { add("meta.json"); add("snapshots_grades_" + (q.get("level") || "MLB").toLowerCase() + w + ".json"); }
    else if (/\/baseball\/players\/[a-z0-9-]+-\d+\/(index\.html)?$$/.test(p)) { add("meta.json"); add("translation_fits.json"); }
    else if (/\/baseball\/farm-systems\/(index\.html)?$$/.test(p)) { ["results", "orgs", "players"].forEach(function (f) { add("farm_" + f + ".json"); });
      // The drill-down's weekly chart is on by default (pitchers, current season); other views don't load it.
      if ((q.get("side") || "pitchers") === "pitchers" && !q.get("dy")) add("farm_staff.json"); }
  })();
</script>

<!-- Chart libraries (blocking: deferring them painted sooner but made data pages slower to become
     interactive on Fast 4G, which is the budget that counts here). Pages without charts set
     `no-chart-libs: true` and skip ~500 KB. -->
$if(no-chart-libs)$
$else$
<script src="/assets/js/d3.min.js"></script>
<script src="/assets/js/plot.umd.min.js"></script>
<script src="/assets/js/sparvi.js"></script>
$endif$

<!-- Umami analytics (cookieless; see the About page's Privacy section). Loads only on sparvi.io, so local
     builds and CI never call it, and honors Do Not Track. Besides page views it records, as totals:
     which tool control was used and the option picked (never what's typed into a search box), and
     clicks on links that leave the site. Pandoc template: write a dollar sign as two. -->
<script>
  (function () {
    if (location.hostname !== "sparvi.io") return;
    var s = document.createElement("script");
    s.defer = true; s.src = "https://cloud.umami.is/script.js";
    s.setAttribute("data-website-id", "946fd54c-2dd9-4728-998a-c974eb444efa");
    s.setAttribute("data-domains", "sparvi.io");
    s.setAttribute("data-do-not-track", "true");
    document.head.appendChild(s);
    var track = function (name, data) { if (window.umami && umami.track) umami.track(name, data); };
    var labelOf = function (el) {
      var l = el.closest("label"), t = l && l.firstChild && l.firstChild.nodeType === 3 ? l.firstChild.textContent : "";
      return (t || el.getAttribute("aria-label") || el.name || "control").trim().slice(0, 60);
    };
    document.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest(".seg button");
      if (b) { track("control", { control: labelOf(b.parentNode), value: b.textContent.trim().slice(0, 60) }); return; }
      var a = e.target.closest && e.target.closest("a[href]");
      if (a && a.host && a.host !== location.host) track("outbound", { host: a.host, url: (a.host + a.pathname).slice(0, 200) });
    }, true);
    document.addEventListener("change", function (e) {
      var el = e.target;
      if (el.tagName === "SELECT") track("control", { control: labelOf(el), value: (el.options[el.selectedIndex] || {}).text || "" });
      else if (el.type === "search") track("search", { control: labelOf(el) });
      else if (el.type === "number" || el.type === "range" || el.type === "checkbox")
        track("control", { control: labelOf(el), value: el.type === "checkbox" ? String(el.checked) : String(el.value) });
    }, true);
  })();
</script>
