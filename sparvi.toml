# Sparvi project config. This is the one file to edit at season rollover.
# Python reads it through sparvi.config; build.sh and the workflows read it with
# `python -m sparvi.config <sport>.<key>`. Nothing else should hardcode a season.

[baseball]
# The current season. Every pull, model, dbt run, and page derives its years from it:
#   MLB seasons     = the last `mlb_seasons` seasons ending here (model trains on all but the last)
#   Triple-A seasons = the last `aaa_seasons` seasons ending here
season = 2026
mlb_seasons = 3
aaa_seasons = 2

# Regular-season date windows for the Savant pull (generous; empty days return nothing).
# At rollover, add the new season here and bump `season` above. That's the whole rollover.
[baseball.season_windows]
2024 = ["2024-03-20", "2024-09-30"]
2025 = ["2025-03-18", "2025-09-28"]
2026 = ["2026-03-25", "2026-09-27"]

# Rule 5 calendar for the current offseason (update each fall; the board's article quotes these).
# 2026: deadline per Baseball America / MLB.com team coverage; draft date per MLB.com's offseason guide.
# The MLB phase of the draft happens only if a CBA is in place (the CBA expires Dec 1, 2026).
[baseball.rule5]
protection_deadline = "2026-11-17"
draft_date = "2026-12-09"
cba_expires = "2026-12-01"

[nfl]
# The current NFL season (the year it kicks off; the 2026 season ends in February 2027).
# Every pull, model, and page derives its years from it.
season = 2026
# First season pulled for the team-efficiency tool (2016 = the Next Gen Stats era).
first_season = 2016
