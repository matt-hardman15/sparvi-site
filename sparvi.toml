# Sparvi project config. This is the one file to edit at season rollover.
# Python reads it through sparvi.config; build.sh and the workflows read it with
# `python -m sparvi.config <sport>.<key>`. Nothing else should hardcode a season.

[baseball]
# The current season. Every pull, model, dbt run, and page derives its years from it:
#   MLB seasons     = the last `mlb_seasons` seasons ending here (model trains on all but the last)
#   Triple-A seasons = the last `aaa_seasons` seasons ending here
season = 2026
mlb_seasons = 3
aaa_seasons = 2
# MLB seasons before the `mlb_seasons` window that the pitch-quality models may use for development and backtests
# (PQ-WINDOW). Pulled once by hand (`ingest/baseball/pull.py --history`), never by the refresh, and read only where a
# file exists: the site's pipeline, the published models and the refresh don't touch them. 2021 is the first season
# with arm angle on most pitches (2020: 75% and a short season; 2019: none).
history_first = 2021
# Triple-A seasons before the `aaa_seasons` window, for developing and backtesting the Triple-A translation (M5-EB).
# Same rules as the MLB history seasons: pulled by hand with `--history`, read only where a file exists. 2023 is the
# first season with Statcast tracking in every Triple-A park.
aaa_history_first = 2023

# Regular-season date windows for the Savant pull (generous; empty days return nothing).
# At rollover, add the new season here and bump `season` above. That's the whole rollover.
[baseball.season_windows]
2021 = ["2021-03-30", "2021-10-05"]
2022 = ["2022-04-05", "2022-10-07"]
2023 = ["2023-03-28", "2023-10-03"]
2024 = ["2024-03-20", "2024-09-30"]
2025 = ["2025-03-18", "2025-09-28"]
2026 = ["2026-03-25", "2026-09-27"]

# Rule 5 calendar for the current offseason (update each fall; the board's article quotes these).
# 2026: deadline per Baseball America / MLB.com team coverage; draft date per MLB.com's offseason guide.
# The MLB phase of the draft happens only if a CBA is in place (the CBA expires Dec 1, 2026).
[baseball.rule5]
protection_deadline = "2026-11-17"
draft_date = "2026-12-09"
cba_expires = "2026-12-01"

[nfl]
# The current NFL season (the year it kicks off; the 2026 season ends in February 2027).
# Every pull, model, and page derives its years from it.
season = 2026
# First season pulled for the team-efficiency tool (2016 = the Next Gen Stats era).
first_season = 2016

[cfb]
# College football (FBS), from the CollegeFootballData.com API (key in CFBD_API_KEY: .env locally,
# an Actions secret in CI; never in code, logs, or site/). The season is the year it kicks off.
season = 2026
# First season pulled (2014 = the College Football Playoff era).
first_season = 2014
# CFBD quota (Tier 1 since Nov 13, 2026: 5,000 calls/month, shared with basketball). Pulls stop at the reserve,
# and a run that needs more than `approve_over` uncached calls asks before starting (--yes).
call_reserve = 100
approve_over = 300

[cbb]
# College basketball (CBB-0a, Nov 20 2026): ingest, checks and private snapshots only; no pages yet. From
# CollegeBasketballData.com, the same service, key (CFBD_API_KEY) and monthly quota as college football.
# The season is the year it ends: 2027 = 2026-27.
season = 2027
# History seasons (CBB-HIST): the first past season kept for model development and backtests, read through
# backtest/asof.py. Pulled once by hand (`ingest/cbb/pull.py --history`), never by the daily workflow, and read only
# where a file exists. 2021 (2020-21) is the shortened COVID season: a late start, fewer games, a single-site tournament.
history_first = 2021
# First and last day a game of this season can fall on; pulls are windowed between them.
start = "2026-11-01"
end = "2027-04-10"
# Basketball stops when the shared quota left falls to this, so football's refresh and the January portal
# window always have calls. A run needing more than `approve_over` uncached calls asks first (--yes).
call_reserve = 1000
approve_over = 300
